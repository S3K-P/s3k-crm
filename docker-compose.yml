name: s3k-crm

# Local development infrastructure.
#
#   docker compose up -d                        -> PostgreSQL + Redis only
#   docker compose --profile backend up -d      -> also builds and runs FastAPI
#
# The default local-development pattern runs FastAPI on the host through `uv`
# (`uv run uvicorn app.main:app --reload`) against these containers.
#
# No secrets are hardcoded: POSTGRES_PASSWORD must come from the git-ignored
# root `.env` file (see .env.example) or the surrounding environment.

services:
  postgres:
    image: postgres:18-alpine
    container_name: s3k-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-s3k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and set it.}
      POSTGRES_DB: ${POSTGRES_DB:-s3k_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-s3k} -d ${POSTGRES_DB:-s3k_crm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: s3k-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    # Optional: the API container is only started with `--profile backend`.
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s3k-backend
    restart: unless-stopped
    environment:
      APP_NAME: s3k-crm-backend
      ENVIRONMENT: development
      DEBUG: "false"
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-s3k}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and set it.}@postgres:5432/${POSTGRES_DB:-s3k_crm}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: s3k-crm-postgres-data
  redis_data:
    name: s3k-crm-redis-data
