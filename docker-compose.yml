name: s3k-crm

# Local development infrastructure.
#
#   docker compose up -d                        -> PostgreSQL + Redis + MinIO
#   docker compose --profile backend up -d      -> also builds and runs FastAPI
#
# The default local-development pattern runs FastAPI on the host through `uv`
# (`uv run uvicorn app.main:app --reload`) against these containers.
#
# No secrets are hardcoded: POSTGRES_PASSWORD and STORAGE_SECRET_ACCESS_KEY must
# come from the git-ignored root `.env` file (see .env.example) or the
# surrounding environment.

services:
  postgres:
    image: postgres:18-alpine
    container_name: s3k-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-s3k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and set it.}
      POSTGRES_DB: ${POSTGRES_DB:-s3k_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-s3k} -d ${POSTGRES_DB:-s3k_crm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: s3k-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # S3-compatible object storage for attachments (ADR-014).
  #
  # Production is Cloudflare R2. MinIO is used locally because it implements
  # the same S3 API, so the application exercises the *real* boto3 code path —
  # pre-signed PUT, HeadObject, pre-signed GET, DeleteObject — rather than a
  # stub that would diverge from production the moment either side changed.
  # Only the endpoint URL and credentials differ between the two.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: s3k-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-s3k-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required. Copy .env.example to .env and set it.}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the attachments bucket once, then exits. Idempotent: re-running
  # `docker compose up` against an existing bucket is a no-op.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: s3k-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}" &&
        echo "bucket $${STORAGE_BUCKET} ready"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-s3k-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required. Copy .env.example to .env and set it.}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-s3k-attachments}
    restart: "no"

  backend:
    # Optional: the API container is only started with `--profile backend`.
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s3k-backend
    restart: unless-stopped
    environment:
      APP_NAME: s3k-crm-backend
      ENVIRONMENT: development
      DEBUG: "false"
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-s3k}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and set it.}@postgres:5432/${POSTGRES_DB:-s3k_crm}
      REDIS_URL: redis://redis:6379/0
      # Container-to-container endpoint. A browser reaches MinIO on the host
      # port instead, which is what STORAGE_PUBLIC_ENDPOINT_URL is for.
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-s3k-attachments}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-s3k-local}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required. Copy .env.example to .env and set it.}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: s3k-crm-postgres-data
  minio_data:
    name: s3k-crm-minio-data
  redis_data:
    name: s3k-crm-redis-data
