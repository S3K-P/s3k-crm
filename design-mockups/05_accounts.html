<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S3K CRM — Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/shell.css">
<link rel="stylesheet" href="shared/views.css">
<style>
  .health-pill { display:inline-flex; align-items:center; gap:5px; font-family: var(--font-display); font-weight: 800; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell" data-shell>
  <div class="app-main-col">
    <main class="app-content" id="page-content">

      <div class="list-head">
        <div class="page-head">
          <div class="page-head-left">
            <div class="page-icon-tile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4M9 6h.01M9 10h.01M9 14h.01M15 6h.01M15 10h.01M15 14h.01"/></svg>
            </div>
            <div><h1 class="page-title">Accounts</h1><p class="page-subtitle">Companies you do business with</p></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Import</button>
            <button class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5M12 3v12"/></svg>Export</button>
            <button class="btn btn-primary btn-sm" data-open="#account-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>New Account</button>
          </div>
        </div>
        <div class="view-switcher" style="margin-top:16px;">
          <div class="view-tab is-active">All Accounts</div>
          <div class="view-tab">My Accounts</div>
          <div class="view-tab">At Risk</div>
        </div>
        <div class="list-meta"><b>84 items</b><span class="sep">•</span>Sorted by <b>Last Activity</b><span class="sep">•</span>Updated 2 min ago</div>
      </div>

      <div class="toolbar">
        <div class="input-icon-wrap toolbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" placeholder="Search this list…" id="list-search">
        </div>
        <button class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Filters</button>
        <button class="icon-btn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      </div>

      <div class="dt-wrap">
        <div class="bulk-bar" id="bulk-bar"><span style="font-size:12.5px;"><b id="bulk-count">0</b> selected</span><button class="btn btn-danger-ghost btn-sm" style="margin-left:auto;">Delete</button><button class="btn btn-ghost btn-sm" id="bulk-clear">Clear</button></div>
        <div class="dt-scroll">
        <table class="dt">
          <thead><tr>
            <th style="width:36px;"><input type="checkbox" class="check-box" id="select-all"></th>
            <th class="sortable">Account Name</th><th>Industry</th><th>Primary Contact</th><th>Owner</th>
            <th style="text-align:center;">Open Opps</th><th>Pipeline Value</th><th style="text-align:center;">Health</th>
            <th>Status</th><th>Last Activity</th><th style="width:100px;"></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        </div>
        <div class="table-footer"><span style="font-size:12px;color:var(--faint);">Showing <b class="txt">1–8</b> of <b class="txt">84</b></span>
          <div style="display:flex;align-items:center;gap:6px;"><button class="pager-btn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="m15 18-6-6 6-6"/></svg></button><span style="font-size:12px;font-weight:600;">Page 1 of 11</span><button class="pager-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ===== New / Edit Account modal ===== -->
<div class="modal-backdrop" id="account-modal">
  <div class="modal contact-form-root" data-form-root style="max-width:680px;">
    <div class="modal-header">
      <div><div style="font-weight:700;font-size:15.5px;" id="account-modal-title">New Account</div><div style="font-size:11.5px;color:var(--faint);margin-top:1px;">Create a new company record</div></div>
      <button class="btn btn-ghost btn-icon" data-close="#account-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="account-form-mount"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="#account-modal">Cancel</button>
      <button class="btn btn-secondary" id="account-save-new">Save &amp; New</button>
      <button class="btn btn-primary" id="account-save">Save</button>
    </div>
  </div>
</div>

<script src="shared/app.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/form-helpers.js"></script>
<script src="shared/accounts-data.js"></script>
<script>
  S3K.mountShell({ active: 'accounts', breadcrumb: ['S3K CRM', 'Accounts'] });

  var INDIAN_STATES = ['Delhi','Gujarat','Karnataka','Kerala','Maharashtra','Rajasthan','Tamil Nadu','Telangana','Uttar Pradesh','West Bengal'];

  function initials(name) { return name.split(' ').map(function(p){return p[0];}).slice(0,2).join('').toUpperCase(); }
  function healthColor(s) { return s >= 75 ? 'var(--success)' : s >= 45 ? 'var(--warning)' : 'var(--danger)'; }
  function statusVariant(s) { return { Active: 'success', Onboarding: 'info', 'At Risk': 'warning', Churned: 'neutral' }[s] || 'neutral'; }

  var tbody = document.getElementById('tbody');
  tbody.innerHTML = S3K_ACCOUNTS.map(function (a) {
    return '<tr data-id="' + a.id + '">' +
      '<td><input type="checkbox" class="check-box row-check" onclick="event.stopPropagation()"></td>' +
      '<td class="cell-name"><div class="name-cell"><div class="avatar avatar-sm" style="background:var(--surface-3);color:var(--accent);border-radius:9px;">' + initials(a.name) + '</div><div><a href="06_account_detail.html">' + a.name + '</a><div style="font-size:11px;color:var(--faint);">' + a.industry + '</div></div></div></td>' +
      '<td data-label="Industry">' + a.industry + '</td>' +
      '<td data-label="Primary Contact">' + a.primaryContact + '</td>' +
      '<td data-label="Owner">' + a.owner + '</td>' +
      '<td data-label="Open Opps" style="text-align:center;">' + a.openOpportunities + '</td>' +
      '<td data-label="Pipeline Value">' + a.totalPipelineValue + '</td>' +
      '<td data-label="Health" style="text-align:center;"><span class="health-pill" style="color:' + healthColor(a.healthScore) + ';">' + a.healthScore + '</span></td>' +
      '<td data-label="Status"><span class="badge badge-' + statusVariant(a.status) + '"><span class="badge-dot"></span>' + a.status + '</span></td>' +
      '<td data-label="Last Activity" style="color:var(--faint);">' + a.lastActivity + '</td>' +
      '<td><div class="row-actions">' +
        '<button aria-label="Call" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>' +
        '<button aria-label="Edit" onclick="event.stopPropagation();openAccountModal(\'' + a.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
        '<button aria-label="More" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>' +
      '</div></td></tr>';
  }).join('');

  tbody.addEventListener('click', function (e) {
    var tr = e.target.closest('tr');
    if (tr && !e.target.closest('.row-check') && !e.target.closest('.row-actions')) window.location.href = '06_account_detail.html';
  });
  function syncBulk() {
    var n = tbody.querySelectorAll('.row-check:checked').length;
    document.getElementById('bulk-bar').classList.toggle('is-visible', n > 0);
    document.getElementById('bulk-count').textContent = n;
  }
  tbody.addEventListener('change', function (e) { if (e.target.classList.contains('row-check')) syncBulk(); });
  document.getElementById('select-all').addEventListener('change', function () { tbody.querySelectorAll('.row-check').forEach(function (c) { c.checked = this.checked; }.bind(this)); syncBulk(); });
  document.getElementById('bulk-clear').addEventListener('click', function () { tbody.querySelectorAll('.row-check').forEach(function (c) { c.checked = false; }); document.getElementById('select-all').checked = false; syncBulk(); });
  document.getElementById('list-search').addEventListener('input', function (e) {
    var q = e.target.value.toLowerCase();
    tbody.querySelectorAll('tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none'; });
  });

  /* ---- Account form ---- */
  var formHtml =
    '<div class="dup-banner" data-dup-banner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><b>Possible duplicate.</b> An account with this name already exists — <a data-dup-dismiss>Continue anyway</a>.</div></div>' +
    '<div class="error-summary" data-error-summary><b>We couldn\'t save this account.</b><ul data-error-list></ul></div>' +
    '<div class="form-section"><div class="form-section-head" data-toggle-section><span class="title">Company Information</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div><div class="form-section-body">' +
      '<div class="form-span-2"><label class="field-label">Account Name <span class="req">*</span></label><input class="input" data-field="name" data-dup-trigger data-dup-var="S3K_ACCOUNTS" data-dup-field="name" placeholder="e.g. Shree Enterprises"></div>' +
      '<div><label class="field-label">Industry</label><select class="input" data-field="industry"><option>Technology</option><option>FMCG & Food</option><option>Logistics & Transport</option><option>Manufacturing</option><option>Retail & Trading</option><option>Real Estate</option><option>Financial Services</option><option>Mining & Manufacturing</option></select></div>' +
      '<div><label class="field-label">Website</label><input class="input" data-field="website" placeholder="company.in"></div>' +
      '<div><label class="field-label">Company Size</label><select class="input" data-field="companySize"><option>1-10</option><option>11-50</option><option>51-200</option><option>201-500</option><option>501-1000</option><option>1000+</option></select></div>' +
      '<div><label class="field-label">Annual Revenue</label><input class="input" data-field="annualRevenue" placeholder="e.g. ₹28 Cr"></div>' +
    '</div></div>' +
    '<div class="form-section"><div class="form-section-head" data-toggle-section><span class="title">Address</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div><div class="form-section-body">' +
      '<div><label class="field-label">Country</label><select class="input" data-field="country"><option>India</option><option>United States</option><option>United Kingdom</option></select></div>' +
      '<div><label class="field-label">State</label><select class="input" data-field="state">' + INDIAN_STATES.map(function(s){return '<option>'+s+'</option>';}).join('') + '</select></div>' +
      '<div><label class="field-label">City</label><input class="input" data-field="city" placeholder="e.g. Mumbai"></div>' +
      '<div><label class="field-label">PIN Code</label><input class="input" data-field="postalCode" maxlength="6" placeholder="400001"></div>' +
      '<div class="form-span-2"><label class="field-label">Street Address</label><textarea class="input" rows="2" data-field="addressLine1"></textarea></div>' +
    '</div></div>' +
    '<div class="form-section"><div class="form-section-head" data-toggle-section><span class="title">CRM Information</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div><div class="form-section-body">' +
      '<div><label class="field-label">Account Owner</label><select class="input" data-field="owner"><option>Rohan Mehta</option><option>Priya Nair</option><option>Meera Pillai</option></select></div>' +
      '<div><label class="field-label">Status</label><select class="input" data-field="status"><option>Active</option><option>Onboarding</option><option>At Risk</option><option>Churned</option></select></div>' +
      '<div><label class="field-label">Lead Source</label><select class="input" data-field="source"><option>Website</option><option>Referral</option><option>Channel Partner</option><option>Trade Show</option><option>Event</option><option>Cold Outreach</option></select></div>' +
      '<div class="form-span-2"><label class="field-label">Description</label><textarea class="input" rows="3" data-field="description"></textarea></div>' +
    '</div></div>';
  document.getElementById('account-form-mount').innerHTML = formHtml;
  S3K.initFormSections();

  function openAccountModal(id) {
    document.getElementById('account-modal-title').textContent = id ? 'Edit Account' : 'New Account';
    document.getElementById('account-modal').classList.add('is-open');
  }
  window.openAccountModal = openAccountModal;

  var root = document.querySelector('#account-modal .contact-form-root');
  document.getElementById('account-save').addEventListener('click', function () {
    S3K.trySaveForm(root, [{ selector: '[data-field="name"]', label: 'Account Name is required' }], {
      successMessage: 'Account saved successfully',
      onSuccess: function () { document.getElementById('account-modal').classList.remove('is-open'); }
    });
  });
  document.getElementById('account-save-new').addEventListener('click', function () {
    S3K.trySaveForm(root, [{ selector: '[data-field="name"]', label: 'Account Name is required' }], {
      successMessage: 'Account saved — ready for the next one',
      onSuccess: function () { root.querySelectorAll('[data-field]').forEach(function (f) { if (f.tagName !== 'SELECT') f.value = ''; }); root.querySelector('[data-field="name"]').focus(); }
    });
  });
</script>
</body>
</html>
