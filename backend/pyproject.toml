[project]
name = "s3k-crm-backend"
version = "0.1.0"
description = "S3K Enterprise Platform backend — modular monolith (Shared Platform + S3K CRM)"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.115.0",
    # Multipart form parsing. Required by Starlette for `UploadFile` and
    # `Form`, which the CSV import endpoints use; attachments never needed it
    # because those upload straight to object storage through a pre-signed URL.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    # ADR-014: object storage on Cloudflare R2, which speaks the S3 API.
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "asyncpg-stubs>=0.30.0",
    # boto3 ships no inline types; mypy runs strict here.
    "boto3-stubs[s3]>=1.35.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (ADR: Ruff replaces black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401", # allow typing.Any where deliberately used
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts are the point of a test suite
    "TID251", # tests may import product modules
    "S608",   # test SQL is built from module constants, never user input
    "RUF012", # SQLAlchemy's __table_args__ dict is the documented idiom
    "S105",   # literal test passwords are fixtures, not credentials
    "S106",
    "S107",
]
"migrations/**" = ["ANN", "E501"]
# The product tree may of course import itself; the ban exists to stop the
# Shared Platform (and app.core) from reaching into products.
"app/products/**" = ["TID251"]
"app/api/router.py" = ["TID251"]  # composition root: mounts product routers
"app/schema.py" = ["TID251"]  # composition root: registers every models module
"app/bootstrap.py" = ["TID251"]  # operator entrypoint: provisions Platform + CRM

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Module-boundary enforcement (ADR-001 / ADR-003 / ADR-004).
# The Shared Platform layer must never import a product module.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.products".msg = "Platform modules must not import product (CRM) modules. See ARCHITECTURE-BOUNDARIES.md"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------------------
# mypy — strict mode
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires live PostgreSQL and Redis (docker compose up -d)",
]
